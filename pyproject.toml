[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prs-zigbee2mqtt-connector"
version = "0.1.0"
description = "Коннектор Peresvet для интеграции с Zigbee2MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prs-connector-core>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
prs-zigbee2mqtt-connector = "prs_zigbee2mqtt_connector:main_entry"

[tool.setuptools.packages.find]
where = ["src"]
